name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Cancel in-progress runs of the same workflow on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.9'      # minimum supported
          - '1'        # latest stable 1.x
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # MetricSpaces is not yet registered in General, so `develop` it from its
      # GitHub URL before resolving/testing.
      - name: Develop unregistered ecosystem packages
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.develop(PackageSpec(url = "https://github.com/JuliaTDA/MetricSpaces.jl"))
            Pkg.instantiate()'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Differentiable Mapper benchmark smoke check
        if: matrix.version == '1'
        run: |
          julia --project=benchmarks -e 'using Pkg; Pkg.develop([PackageSpec(url="https://github.com/JuliaTDA/MetricSpaces.jl"),PackageSpec(path=pwd())]); Pkg.instantiate()'
          julia --project=benchmarks -e 'include("benchmarks/differentiable.jl"); benchmark_differentiable(samples=2,seconds=0.05,output=tempname())'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
